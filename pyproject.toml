[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'flimkit'
description = 'Fluorescence lifetime imaging analysis: reading, fitting, phasors and stitching'
readme = 'README.md'
requires-python = '>=3.12'
license = 'MIT'
license-files = ['LICENSE.md']
authors = [
    {name = 'Alex Hunt', email = 'alexander.hunt@ed.ac.uk'},
]
keywords = ['FLIM', 'fluorescence', 'lifetime', 'microscopy', 'TCSPC', 'phasor']
classifiers = [
    'Development Status :: 4 - Beta',
    'Intended Audience :: Science/Research',
    'Programming Language :: Python :: 3',
    'Topic :: Scientific/Engineering :: Bio-Informatics',
    'Topic :: Scientific/Engineering :: Image Processing',
]
dynamic = ['version']

dependencies = [
    'colorama==0.4.6',
    'inquirer==3.4.1',
    'lfdfiles',
    'lz4>=4.0',
    'matplotlib==3.10.8',
    'numba',
    'numpy==2.4.2',
    'opencv-python-headless==4.13.0.90',
    'openpyxl==3.1.5',
    'pandas==3.0.1',
    'Pillow>=10.0.0',
    'psutil',
    'phasorpy==0.12',
    'photonsfile',
    'ptufile',
    'PyWavelets>=1.4.0',
    'scipy==1.17.1',
    'sdtfile',
    'shapely==2.1.2',
    'tifffile',
    'tqdm==4.67.3',
    'xarray==2026.1.0',
]

[project.optional-dependencies]
gui = [
    'tkinterdnd2==0.4.3',
    'TKinterModernThemes',
]
notebook = [
    'ipython==9.10.0',
    'ipywidgets==8.1.8',
]
segmentation = [
    'cellpose>=3.0',
]
mlx = [
    'mlx',
]
torch = [
    'torch',
]
test = [
    'pytest==9.0.2',
]
all = [
    'flimkit[gui,notebook,segmentation]',
]

[project.scripts]
flimkit = 'flimkit.cli:run'

[project.urls]
Homepage = 'https://github.com/FLIMKit/FLIMKit'
Documentation = 'https://github.com/FLIMKit/FLIMKit/wiki'
Issues = 'https://github.com/FLIMKit/FLIMKit/issues'

[project.entry-points.'flimkit.plugins']

[tool.setuptools.dynamic]
version = {attr = 'flimkit._version.__version__'}

[tool.setuptools.packages.find]
include = ['flimkit*']
exclude = ['flimkit_tests*']
namespaces = true

[tool.setuptools.package-data]
'flimkit.machine_irf' = ['*.csv', '*.npy', '*.json']
'flimkit.UI' = ['*.png', '*.ico', '*.icns']
