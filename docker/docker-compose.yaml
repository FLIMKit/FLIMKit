services:
  flimkit:
    image: alex1075/flimkit:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "14500:14500"      # web UI
      # - "14501:14501"    # full desktop view, needs FLIMKIT_DESKTOP=1
    volumes:
      - /mnt/tank/microscopy:/data
      - /mnt/tank/flimkit-config:/root/.flimkit
    environment:
      - TZ=Etc/UTC
      # - FLIMKIT_PASSWORD=choose-a-password
      # - FLIMKIT_DESKTOP=1
    restart: unless-stopped
    shm_size: 512m
