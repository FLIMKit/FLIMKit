name: docker

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - 'docker/**'
      - 'requirements.txt'
      - '.github/workflows/docker.yml'
  workflow_dispatch:
    inputs:
      push_images:
        description: "Push images to Docker Hub"
        required: false
        default: "true"

env:
  IMAGE: alex1075/flimkit

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: docker/Dockerfile
            tag: latest
            gpu: false
          - dockerfile: docker/Dockerfile.cuda
            tag: cuda
            gpu: true
          - dockerfile: docker/Dockerfile.rocm
            tag: rocm
            gpu: true

    steps:
      - uses: actions/checkout@v4

      - name: Read version from flimkit/_version.py
        id: ver
        run: |
          VERSION=$(python -c "import re; m = re.search(r'__version__\s*=\s*[\"\'](.*?)[\"\']', open('flimkit/_version.py').read()); print(m.group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "FLIMKit $VERSION -> ${{ env.IMAGE }}:${{ matrix.tag }}"

      - name: Decide whether to push
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "push=${{ github.event.inputs.push_images }}" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        if: matrix.gpu
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Build the CPU image for a smoke test
        if: matrix.tag == 'latest'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: flimkit-smoke:test
          cache-from: type=gha,scope=${{ matrix.tag }}

      - name: Smoke test the web UI
        if: matrix.tag == 'latest'
        run: |
          docker run -d --name flimkit-smoke -p 14500:14500 -e FLIMKIT_PASSWORD=smoke flimkit-smoke:test
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:14500/healthz >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:14500/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:14500/api/state)" = "401"
          curl -fsS -u flimkit:smoke http://127.0.0.1:14500/api/state \
            | python3 -c "import json, sys; s = json.load(sys.stdin); print('web UI up:', s['form'], len(s['fields']), 'fields')"

      - name: Smoke test container logs
        if: always() && matrix.tag == 'latest'
        run: docker logs flimkit-smoke || true

      - name: Log in to Docker Hub
        if: steps.mode.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ steps.mode.outputs.push == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ matrix.tag }}
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}-${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}
