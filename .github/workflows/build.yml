name: Build FLIMKit App

on:
  push:
    tags:
      - "v*"         
  workflow_dispatch:  
    inputs:
      publish_release:
        description: "Publish artifacts to a GitHub Release"
        required: false
        default: "true"

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag:     ${{ steps.read.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version from flimkit/_version.py
        id: read
        run: |
          VERSION=$(python -c "import re; m = re.search(r'__version__\s*=\s*[\"\'](.*?)[\"\']', open('flimkit/_version.py').read()); print(m.group(1))")
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"     >> "$GITHUB_OUTPUT"
          echo "Building FLIMKit $VERSION (tag: v$VERSION)"

  build:
    needs: get-version
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: FLIMKit-linux
          - os: windows-latest
            artifact_name: FLIMKit-windows
          - os: macos-latest
            artifact_name: FLIMKit-macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 3.13 ships Tk 8.6; 3.14 ships Tk 9.0, which breaks the GUI.
          # See the "Verify Tk version" step below.
          python-version: "3.13"

      - name: Verify Python version
        run: |
          python -c "import sys; print('Python:', sys.version)"
          python -c "import sys; raise SystemExit(0 if sys.version_info >= (3, 12) else 'Python >= 3.12 required for phasorpy==0.9')"

      - name: Verify Tk version
        # The GUI is Tk 8.6 only. TKinterModernThemes' sun-valley.tcl declares
        # `package require Tk 8.6` and fails on Tk 9 with `invalid command name
        # "set_theme"`, and tkinterdnd2's bundled tkdnd cannot load either.
        # Nothing else in CI launches Tk, so without this check a Tk 9 runner
        # produces a build that passes every test and then crashes on startup.
        if: runner.os != 'Linux'
        run: |
          python -c "import tkinter, sys; v = tkinter.TkVersion; print('Tk:', v); sys.exit(0 if abs(v - 8.6) < 0.01 else f'Tk {v} will not run the GUI; Tk 8.6 required')"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Install tkinter + libGL (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y python3-tk libgl1

      # No tkinter step for macOS: setup-python's build already provides it.
      # `brew install python-tk@3.14` only adds tkinter to Homebrew's own
      # python@3.14 (a different interpreter) while pulling in Tcl/Tk 9, which
      # PyInstaller may then bundle in place of the working 8.6.

      - name: Build and sign
        run: python build_and_sign.py
        env:

          PYTHONUTF8: "1"
          APPLE_TEAM_ID:       ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DEVELOPER_ID:  ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_ID:            ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD:  ${{ secrets.APPLE_APP_PASSWORD }}
          WINDOWS_CERT_PATH:     ${{ secrets.WINDOWS_CERT_PATH }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}

      - name: Package macOS app bundle
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/FLIMKit.app dist/FLIMKit-macos.zip

      - name: Package Linux binary
        if: runner.os == 'Linux'
        run: zip -j dist/FLIMKit-linux.zip dist/FLIMKit
      - name: Package Windows binary
        if: runner.os == 'Windows'
        run: 7z a -tzip dist\FLIMKit-windows.zip dist\FLIMKit.exe
        shell: pwsh

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/FLIMKit-macos.zip
          retention-days: 30

      - name: Upload artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/FLIMKit-linux.zip
          retention-days: 30

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/FLIMKit-windows.zip
          retention-days: 30

  release:
    needs: [get-version, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish_release == 'true'
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare release archives
        run: |
          mkdir -p release
          cd artifacts
          for d in */; do
            cp "$d"*.zip ../release/
          done
          ls -lh ../release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.get-version.outputs.tag }}
          name:     FLIMKit ${{ needs.get-version.outputs.version }}
          files:    release/*.zip